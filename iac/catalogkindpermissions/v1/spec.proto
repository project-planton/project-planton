syntax = "proto3";

package dev.planton.iac.catalogkindpermissions.v1;

// CatalogKindPermissionsSpec holds per-provider permission manifests. A
// kind fills exactly the sections its modules touch: an AWS kind
// fills aws; a Kubernetes kind fills kubernetes (and a cloud section
// too if its modules also call cloud APIs, e.g. for workload-identity
// wiring). An absent section means "the modules touch no such API", which
// is itself a claim the conformance and capture gates hold the kind
// to.
//
// Two permission vocabularies live here. The IAM-statement providers
// (aws/gcp/azure) and Kubernetes express least privilege as policy
// material -- statements, permission groups, RBAC rules. The
// token-scoped providers (cloudflare/digital_ocean/auth0/stripe)
// authenticate with a bearer credential whose least-privilege story is the
// credential's OWN composition: Cloudflare tokens are built from named
// permission groups, DigitalOcean tokens from named scopes, an Auth0
// machine-to-machine client from the Management API scopes its grant
// carries, and a Stripe restricted key from a Read or Write choice per
// resource. Their sections declare exactly what a least-privilege runner
// credential is built from, in the provider's own vocabulary, held to the
// provider's own inventory by the conformance gates where the provider
// publishes one (Stripe does not; see StripePermissions).
message CatalogKindPermissionsSpec {
  AwsPermissions aws = 1;
  GcpPermissions gcp = 2;
  AzurePermissions azure = 3;
  KubernetesPermissions kubernetes = 4;
  CloudflarePermissions cloudflare = 5;
  DigitalOceanPermissions digital_ocean = 6;
  Auth0Permissions auth0 = 7;
  StripePermissions stripe = 8;
}

// Provenance says how a permission entry was established.
enum Provenance {
  provenance_unspecified = 0;
  // Derived by static analysis of the platform module sources: the entry
  // covers the module's declared resources but has not been observed
  // against a live cloud account.
  derived = 1;
  // Proven by a live run: an identity holding exactly these permissions --
  // nothing more -- deployed, updated and destroyed this kind through
  // Planton. The strongest claim: the entries are enough, observed against a
  // real cloud account. (Not that every entry was called: a provider's logs
  // record writes but not most reads, so sufficiency is what a run can show.)
  proven = 2;
}

// PermissionReach says where in the provider's resource hierarchy an
// entry's permissions are granted. A connection is set up against one
// target -- a GCP project, an AWS account -- and a role on that target
// cannot hold a permission that authorizes above it, so every reader
// renders, grants and checks each reach on its own: a connection's role
// holds the target's entries, an organization-level grant holds the
// organization's, and a check never asks the target about a permission it
// cannot answer for. The value is a fact about the permissions, read from
// the provider's own scope-typed inventory where it publishes one (GCP's
// testable-permissions list), and the inventory gate holds every entry to
// it. Unspecified is refused.
enum PermissionReach {
  permission_reach_unspecified = 0;
  // The connection's own target: the GCP project, the AWS account.
  target = 1;
  // Above the target: a GCP organization or folder; AWS Organizations,
  // which answers only in the organization's management account.
  organization = 2;
  // A GCP billing account.
  billing_account = 3;
}

// PermissionPrivilege says what an entry lets the principal do beyond
// creating, changing and deleting resources. It is what a connection's
// permission choices are drawn along: deploying is granted by default,
// running a resource as an identity that already exists is part of
// deploying (a Cloud Run service runs as a service account, a Lambda
// function assumes its execution role), and granting access to others is
// asked for explicitly -- a principal that can grant access can grant
// itself anything. An entry's privilege is the highest of its
// permissions'; the inventory gate derives it from each provider's list of
// privileged permissions, so the field can never drift from the
// permissions it describes. Unspecified is refused.
enum PermissionPrivilege {
  permission_privilege_unspecified = 0;
  // Creates, reads, changes and deletes resources.
  ordinary = 1;
  // Lets a resource run as an identity that already exists: GCP
  // iam.serviceAccounts.actAs, AWS iam:PassRole, Azure's user-assigned
  // identity assign action.
  uses_identity = 2;
  // Grants access to others: changes an IAM policy, creates a role, a user
  // or a key, or assigns a role.
  grants_access = 3;
}

// PermissionCondition says an entry is needed only when the kind's
// manifest sets a field of its spec. An entry without one is needed by
// every deployment of the kind. The condition is data so every reader
// decides it the same way -- a catalog page marks the entry optional, a
// chart unions it only when one of its manifests sets the field, a
// connection check does not report its absence as a gap -- rather than each
// reading a sentence in the notes. The permissions gate proves the field
// exists in the kind's own spec.
message PermissionCondition {
  // Path of the spec field, in the proto field names a manifest uses,
  // dot-separated for a nested field (e.g. "roles", "enabled_clients",
  // "containers.env.secret_value").
  // "Set" means a repeated or map field is non-empty, a message field is
  // present, and a scalar holds a non-default value. A path that crosses a
  // repeated message field is set when ANY element sets the rest of the path
  // -- a permission one container's variable needs is needed by the
  // kind.
  string spec_field_set = 1;
}

// AwsPermissions is the least-privilege IAM policy material for the runner's
// AWS principal, expressed as policy-ready statements.
message AwsPermissions {
  repeated AwsStatement statements = 1;
}

// AwsStatement is one IAM policy statement: a set of actions over a
// resource scope. Group actions the way a policy author would -- one
// statement per service concern, not one per action.
message AwsStatement {
  // Statement id, PascalCase, unique within the kind (e.g.
  // "ManageTable", "ReadVpcContext"). Becomes the Sid in generated
  // policies.
  string sid = 1;
  // IAM actions in the provider's exact "service:Action" spelling.
  // Wildcards only where the service demands them (e.g. paired
  // Describe*/List* calls a provider SDK issues internally) -- the point
  // of this file is least privilege, and every wildcard must be defended
  // in notes.
  repeated string actions = 2;
  // Resource ARNs or ARN patterns the actions are scoped to. "*" only when
  // the API genuinely supports no resource scoping; defend it in notes.
  repeated string resources = 3;
  Provenance provenance = 4;
  // For derived entries: which module resources this statement covers
  // (terraform type names are the useful vocabulary). Also the home for
  // wildcard defenses.
  string notes = 5;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 6;
  // Where the actions are granted: the account, or AWS Organizations.
  PermissionReach reach = 7;
  // What the actions let the principal do beyond managing resources.
  PermissionPrivilege privilege = 8;
}

// GcpPermissions is the least-privilege permission material for the
// runner's GCP principal.
message GcpPermissions {
  repeated GcpPermissionGroup groups = 1;
  // The kinds whose deployments turn on the Google APIs this kind's
  // resources live in, for a kind that turns none on itself -- a Cloud SQL
  // database lives in the API its instance's kind turns on. Every kind
  // turns on what it needs at first deploy, and a connection's setup turns
  // on only the APIs Planton itself operates on (IAM, Resource Manager,
  // Service Usage), so a kind touching any other service either holds
  // serviceusage.services.enable or names here the kinds that turn its
  // services on; the permissions gate refuses a kind that does neither, and
  // a named kind that does not touch the service. Kind names as the catalog
  // spells them (e.g. "GcpCloudSql"). Empty when the kind turns its own
  // APIs on, or touches only the operating ones.
  repeated string api_enabled_by = 2;
  // The Google APIs this kind's calls need turned on in the project of the
  // identity making them, e.g. "orgpolicy.googleapis.com". A resource that
  // lives in no project -- an organization policy, a folder's firewall
  // policy, a billing budget -- is managed through calls Google charges to
  // the caller's own project, which only the connection knows, so the
  // connection's setup turns these on there when it is granted the reach
  // the kind needs. Empty for a kind whose resources live in a project.
  repeated string caller_project_services = 3;
}

// GcpPermissionGroup is one coherent set of IAM permissions (the units a
// custom role is built from).
message GcpPermissionGroup {
  // What the group covers, in the same spirit as an AWS Sid (e.g.
  // "ManageCluster").
  string purpose = 1;
  // GCP IAM permissions in exact dotted form, e.g.
  // "container.clusters.create".
  repeated string permissions = 2;
  Provenance provenance = 3;
  // For derived entries: which module resources this group covers.
  string notes = 4;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 5;
  // Where the permissions are granted: the project, the organization, or
  // a billing account. A group holds permissions of one reach.
  PermissionReach reach = 6;
  // What the permissions let the principal do beyond managing resources.
  PermissionPrivilege privilege = 7;
  // The predefined role granted for this group instead of placing its
  // permissions in a custom role, as "roles/<name>". Set exactly when a
  // custom role cannot carry the group: Google publishes some of its
  // permissions as unsupported in custom roles, or the group's reach is a
  // billing account (a billing account takes a custom role only from its
  // own organization, which a connection's organization often is not). The
  // inventory gate proves the role holds every permission of the group and
  // refuses the basic roles (owner, editor, viewer).
  string predefined_role = 8;
}

// AzurePermissions is the least-privilege RBAC material for the runner's
// Azure principal.
message AzurePermissions {
  repeated AzureActionGroup groups = 1;
}

// AzureActionGroup is one coherent set of Azure RBAC actions (the units a
// custom role definition is built from).
message AzureActionGroup {
  // What the group covers (e.g. "ManageCluster").
  string purpose = 1;
  // Control-plane actions in exact provider form, e.g.
  // "Microsoft.ContainerService/managedClusters/write".
  repeated string actions = 2;
  // Data-plane actions (dataActions in a role definition), when the
  // modules touch data-plane APIs.
  repeated string data_actions = 3;
  Provenance provenance = 4;
  // For derived entries: which module resources this group covers.
  string notes = 5;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 6;
  // What the actions let the principal do beyond managing resources. Azure
  // entries carry no reach: every catalog kind is granted at the
  // connection's subscription.
  PermissionPrivilege privilege = 7;
}

// CloudflarePermissions is the least-privilege API-token material for the
// runner's Cloudflare credential. Cloudflare has no IAM-statement
// policies: a token IS the policy, assembled from named permission groups
// ("DNS Write", "Zone Read") that Cloudflare defines centrally and scopes
// to specific resource levels (a zone, an account, an R2 bucket). The
// entries here are the groups a least-privilege runner token is built
// from.
message CloudflarePermissions {
  repeated CloudflareTokenGroup groups = 1;
}

// CloudflareTokenGroup is one Cloudflare permission group the runner's
// token needs, at the scope level it applies to. Group names are NOT
// unique on their own -- Cloudflare defines same-named groups at
// different scopes -- so the (name, scope) pair is the identity, and the
// conformance gate proves every pair exists in Cloudflare's own
// permission-group inventory.
message CloudflareTokenGroup {
  // What the group covers for this kind, in the same spirit as an
  // AWS Sid or a GCP group purpose (e.g. "ManageZone", "ManageRecords").
  string purpose = 1;
  // The permission-group name verbatim from Cloudflare's own inventory
  // (e.g. "DNS Write", "Zone Read", "Billing Write"). Never paraphrased:
  // the gate matches this exact spelling against the inventory snapshot.
  string name = 2;
  // The resource level the group applies at, in Cloudflare's own scope
  // identifier spelling (e.g. "com.cloudflare.api.account.zone" for
  // zone-scoped groups, "com.cloudflare.api.account" for account-scoped
  // ones). A string, not an enum, deliberately: Cloudflare grows this
  // vocabulary (an R2-bucket scope and a flagship-app scope already exist
  // beyond the classic account/zone/user trio), and the inventory
  // snapshot -- not this schema -- is the closed set the gate enforces.
  string scope = 3;
  Provenance provenance = 4;
  // For derived entries: which module resources this group covers, plus
  // any conditionality (e.g. a group needed only when a spec field is
  // set) and the endpoint evidence the derivation stands on.
  string notes = 5;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 6;
}

// DigitalOceanPermissions is the least-privilege credential material for
// the runner's DigitalOcean access, across the provider's TWO credential
// planes. The REST API plane authenticates with a personal access token
// carrying named scopes (groups); the Spaces object-storage plane speaks
// the S3-compatible API and authenticates with a separate Spaces key
// pair whose grants are per-bucket permission levels (spaces_grants) --
// an API token cannot reach it. A kind fills the planes its modules
// touch: most fill groups only; a kind whose modules speak only the
// Spaces API fills spaces_grants only.
message DigitalOceanPermissions {
  repeated DigitalOceanScopeGroup groups = 1;
  repeated DigitalOceanSpacesGrant spaces_grants = 2;
}

// DigitalOceanScopeGroup is one coherent set of DigitalOcean token scopes
// (the units the token-creation page's Custom Scopes picker assembles).
message DigitalOceanScopeGroup {
  // What the group covers, in the same spirit as a GCP group purpose
  // (e.g. "ManageDroplet", "ResolveSshKeys").
  string purpose = 1;
  // DigitalOcean token scopes in the provider's exact "resource:action"
  // spelling (e.g. "droplet:create", "ssh_key:read"). Action segments go
  // beyond CRUD ("database:view_credentials", "kubernetes:access_cluster");
  // the conformance gate proves each scope exists in DigitalOcean's own
  // published scope inventory. The alias scopes "api:read" and
  // "api:write" are refused outright -- an alias expands to everything
  // and is never least privilege.
  repeated string scopes = 2;
  Provenance provenance = 3;
  // For derived entries: which module resources this group covers, plus
  // any conditionality (e.g. a scope needed only when a spec field is
  // set) and the endpoint evidence the derivation stands on.
  string notes = 4;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 5;
}

// DigitalOceanSpacesGrant is one grant the runner's Spaces key needs, at
// DigitalOcean's own per-bucket grant vocabulary: a Spaces key carries
// grants of {bucket, permission} where permission is "read", "readwrite",
// or "fullaccess" (fullaccess cannot mix with scoped grants -- the
// provider prioritizes it). Bucket names are deployment-time values a
// catalog manifest cannot know, so the grant declares the permission
// LEVEL and the notes teach the scoping (e.g. "limited to the bucket this
// kind manages").
message DigitalOceanSpacesGrant {
  // What the grant covers, in the same spirit as a scope group's purpose
  // (e.g. "ManageBucket").
  string purpose = 1;
  // The grant level in the provider's exact spelling: "read",
  // "readwrite", or "fullaccess".
  string permission = 2;
  Provenance provenance = 3;
  // For derived entries: which module resources this grant covers, the
  // S3-compatible calls the modules issue, and the least-privilege bucket
  // scoping the operator should apply when minting the key.
  string notes = 4;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 5;
}

// Auth0Permissions is the least-privilege credential material for the
// runner's Auth0 access: a machine-to-machine application in the target
// tenant, authorized for the tenant's Management API audience
// (https://{tenant-domain}/api/v2/) with a grant that carries named
// scopes. The modules exchange the application's client id and secret for
// a token through the client-credentials flow, and Auth0 refuses any call
// whose token lacks the endpoint's scope. The entries here are the scopes
// a least-privilege grant is built from.
message Auth0Permissions {
  repeated Auth0ScopeGroup groups = 1;
}

// Auth0ScopeGroup is one coherent set of Management API scopes (the units
// the application's API grant is assembled from).
message Auth0ScopeGroup {
  // What the group covers, in the same spirit as a GCP group purpose
  // (e.g. "ManageConnection", "WriteConnectionOptions").
  string purpose = 1;
  // Management API scopes in Auth0's exact "verb:resource" spelling
  // (e.g. "create:clients", "read:client_keys"). The verb comes FIRST --
  // the reverse of DigitalOcean's "resource:action" -- and goes beyond
  // CRUD ("blacklist:tokens"). The conformance gate proves each scope
  // exists in the tenant's own Management API definition, which is the set
  // Auth0 checks a grant against. The published API reference is not that
  // set: it omits scopes the tenant enforces, among them the
  // "connections_options" pair a connection's options tree needs.
  repeated string scopes = 2;
  Provenance provenance = 3;
  // For derived entries: which module resources this group covers and the
  // endpoint evidence the derivation stands on. Whether the group is needed
  // at all is its condition, never a sentence here: a credential missing a
  // conditional group is least privilege, not a defect, for a deployment
  // that never sets the field.
  string notes = 4;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 5;
}

// StripePermissions is the least-privilege credential material for the
// runner's Stripe access: a restricted API key (rk_test_... or rk_live_...),
// whose permissions are a None, Read, or Write choice per resource on the
// Dashboard's restricted-key form. Write implies Read, and Stripe refuses a
// call the key lacks with a message that names the missing permission
// ("Permission denied... Enabling Prices Read"). An account's standard
// secret key grants everything and is never least privilege.
//
// Stripe publishes no machine-readable inventory of those resources -- its
// restricted-key docs describe the form, and no API lists it -- so the
// conformance gate holds entries to their structure and spelling, not to an
// inventory. The resource names are the Dashboard's labels, and a live run
// under a key built from exactly these entries is what upgrades them from
// derived to proven.
message StripePermissions {
  repeated StripePermissionGroup groups = 1;
}

// StripePermissionGroup is one coherent set of restricted-key permissions.
message StripePermissionGroup {
  // What the group covers, in the same spirit as a GCP group purpose
  // (e.g. "ManageWebhookEndpoint").
  string purpose = 1;
  // The resource permissions, one per resource.
  repeated StripeResourcePermission permissions = 2;
  Provenance provenance = 3;
  // For derived entries: which module resources this group covers and the
  // API endpoints the derivation stands on (GET is Read; POST and DELETE
  // are Write, per Stripe's restricted-key docs).
  string notes = 4;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 5;
}

// StripeResourcePermission is one resource's row on the restricted-key form.
message StripeResourcePermission {
  // The resource as the Dashboard's restricted-key form labels it
  // (e.g. "Webhook Endpoints", "Customer portal").
  string resource = 1;
  // The access level in the form's own spelling: "read" or "write"
  // ("write" includes read; "none" is expressed by leaving the resource out).
  string access = 2;
}

// KubernetesPermissions is the least-privilege RBAC material for the
// runner's cluster credential, expressed as policy rules (the units a Role
// or ClusterRole is built from).
message KubernetesPermissions {
  repeated KubernetesRule rules = 1;
}

// KubernetesRule is one RBAC policy rule.
message KubernetesRule {
  // API groups the rule covers ("" for core).
  repeated string api_groups = 1;
  // Resource types within those groups, lowercase plural ("statefulsets",
  // "secrets").
  repeated string resources = 2;
  // Verbs the runner needs ("get", "create", "delete", ...). Wildcards are
  // never acceptable here.
  repeated string verbs = 3;
  // True when the rule requires cluster scope (CRDs, namespaces,
  // cluster-scoped operators); false when namespace scope suffices.
  bool cluster_scoped = 4;
  Provenance provenance = 5;
  // For derived entries: which module resources this rule covers.
  string notes = 6;
  // Absent: every deployment of the kind needs this entry.
  PermissionCondition condition = 7;
}
