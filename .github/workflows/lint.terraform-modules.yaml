# =============================================================================
# Terraform Module Static Gate
# =============================================================================
# Catches the class of failure that reached production via KubernetesExternalDns:
# an unpinned helm provider floated to v3 on a fresh `tofu init`, and the v2 `set {}`
# block was rejected by the v3 schema. Both are STATIC errors -- they surface at
# `tofu init` + `tofu validate`, with no cluster/DNS/credentials -- so they belong in
# the build lane, not in e2e (which needs real infra and skips DNS-dependent kinds).
#
# Jobs:
#   tf-provider-pins   (PR + push, BLOCKING) -- every iac/tf module must pin every
#                       provider it references (root-cause guard; repo-wide, static).
#   tf-provider-locks  (PR + push, BLOCKING) -- every iac/tf module's committed
#                       .terraform.lock.hcl is its projection of the catalog's one
#                       canonical lock (catalog/_providers), which covers every
#                       module's constraints (offline; `make lock-providers` fixes it).
#   tf-beta-admissions (PR + push, BLOCKING) -- every `provider = <secondary channel>`
#                       attachment is recorded in pkg/providerparity/admissions and every
#                       admission is attached by a module (static, no Go).
#   tf-generated-drift (PR + push, BLOCKING) -- every committed generator-owned file
#                       (variables.tf for enrolled kinds -- every kind of a generator-owned
#                       provider, plus the individually enrolled ones; helm_crds.tf wherever
#                       it exists) equals the generator's output (pkg/iac/tofu/generators
#                       drift tests).
#   tf-validate-changed (PR + push, BLOCKING) -- tofu fmt -check + init -backend=false
#                       -lockfile=readonly + validate on every iac/tf module the change
#                       touches. A module counts as touched when any file under it moves
#                       -- its .terraform.lock.hcl included, so a lock sweep that moves a
#                       provider validates every module running the new release. Pushes to
#                       main run it too: most changes land without a pull request. A
#                       change list that cannot be computed fails the job; it never
#                       passes by validating nothing.
#   tf-validate-all    (nightly + manual)    -- the same read-only init + validate across
#                       ALL modules: every module still installs exactly its locked,
#                       checksummed providers and validates against them. Does not gate
#                       PRs; a red scheduled run opens (or comments on) one tracking issue,
#                       so a provider break that reaches main is seen the next morning.
#   tf-isolated-plans  (PR + push, BLOCKING) -- credential-isolated `tofu plan` guards: a
#                       module planned with ONLY what its connection supplies (no AWS_*,
#                       empty HOME). `validate` never configures a provider, so a module that
#                       configures one it does not use on its default path passes validate and
#                       any live lane whose machine holds that credential.
#
# See hack/guards/ensure_tf_provider_pins.sh and
# _changelog/2026-06/2026-06-04-191500-helm-provider-v3-migration-and-externaldns-parity.md
# =============================================================================

name: lint.terraform-modules

on:
  pull_request:
    paths:
      - 'catalog/**/iac/tf/**'
      - 'hack/guards/ensure_tf_provider_pins.sh'
      - 'hack/guards/ensure_tf_provider_locks.sh'
      - 'catalog/_providers/**'
      - 'pkg/iac/tofu/providerlocks/**'
      - 'hack/guards/ensure_beta_admissions.sh'
      - 'pkg/providerparity/admissions/**'
      - 'hack/guards/ensure_create_namespace_default_false.sh'
      - 'pkg/iac/tofu/generators/**'
      - 'pkg/iac/tofu/tofumodule/**'
      - 'pkg/iac/iacinput/providerenvvars/**'
      - '.github/workflows/lint.terraform-modules.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**/iac/tf/**'
      - 'hack/guards/ensure_tf_provider_pins.sh'
      - 'hack/guards/ensure_tf_provider_locks.sh'
      - 'catalog/_providers/**'
      - 'pkg/iac/tofu/providerlocks/**'
      - 'hack/guards/ensure_beta_admissions.sh'
      - 'pkg/providerparity/admissions/**'
      - 'hack/guards/ensure_create_namespace_default_false.sh'
      - 'pkg/iac/tofu/generators/**'
      - 'pkg/iac/tofu/tofumodule/**'
      - 'pkg/iac/iacinput/providerenvvars/**'
      - '.github/workflows/lint.terraform-modules.yaml'
  schedule:
    - cron: '17 6 * * *' # nightly full validate (provider-drift net)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tf-lint-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  # A push validates only its own diff, so a later push must never cancel it:
  # the cancelled push's modules would go unvalidated. Pull requests (and the
  # schedule) supersede their earlier runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Root-cause guard: static, no network. Runs on every PR/push (and harmlessly on
  # schedule). This is what would have failed the original ExternalDns PR.
  tf-provider-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify all iac/tf modules pin their providers
        run: bash ./hack/guards/ensure_tf_provider_pins.sh

  # Every module runs exact, checksummed provider releases: its committed lock is
  # its projection of the one canonical lock, and the canonical lock satisfies
  # every module's constraint. Static, no network.
  tf-provider-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify every module's provider lock is current
        run: bash ./hack/guards/ensure_tf_provider_locks.sh

  # Secondary-channel discipline: a resource block attaches google-beta only
  # under a recorded admission, and every admission is attached somewhere.
  # The Go accounting (lint.provider-parity) is the full gate; this is its
  # dependency-free half, in the lane that runs on every module edit.
  tf-beta-admissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify secondary-channel attachments are admitted
        run: bash ./hack/guards/ensure_beta_admissions.sh

  # Generator ownership: a committed variables.tf (enrolled kinds: every kind of a
  # generator-owned provider, plus the individually enrolled ones) or helm_crds.tf
  # (every module that carries one) must equal what the generator emits, so a fix
  # lands once in the generator and regenerates everywhere. Static, no network.
  tf-generated-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generator-owned Terraform files match the generator
        run: go test ./pkg/iac/tofu/generators/

  # Root-cause guard: static, no network. A plain proto3 `bool create_namespace` whose
  # TF default is true creates the namespace on every unset deploy and makes explicit
  # false unrepresentable (the KubernetesTemporal failure). Default must be false.
  tf-create-namespace-default:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify create_namespace defaults to false
        run: bash ./hack/guards/ensure_create_namespace_default_false.sh

  # Credential isolation: plan modules with only what their connection supplies. The
  # guards live beside the seam they prove (pkg/iac/tofu/tofumodule) and download
  # providers from the registry, so they are opt-in for local runs and forced on here.
  tf-isolated-plans:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: ghcr.io/plantonhq/planton/ci-toolchain:latest
    timeout-minutes: 30
    env:
      PLANTON_TF_PLAN_GUARDS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Credential-isolated plans
        run: go test ./pkg/iac/tofu/tofumodule/ -run 'PlansWithOnlyItsConnection' -count=1 -v

  # Validate every module the change touches, on pull requests and on pushes.
  tf-validate-changed:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/plantonhq/planton/ci-toolchain:latest
    timeout-minutes: 60
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ runner.os }}

      - name: Determine changed iac/tf modules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            base="${{ github.event.before }}"
            # A new branch (or a forced history) has no usable before-commit:
            # validate every module rather than guess.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              find catalog -type d -path '*/iac/tf' | grep -E '^catalog/[^/]+/[^/]+/iac/tf$' | sort > changed_modules.txt
              echo "No comparable base commit; validating all $(wc -l < changed_modules.txt) modules."
              exit 0
            fi
          fi
          git diff --name-only "$base" HEAD > changed_files.txt
          sed -nE 's#^(catalog/[^/]+/[^/]+/iac/tf)/.*#\1#p' changed_files.txt | sort -u > changed_modules.txt
          echo "Changed iac/tf modules ($(wc -l < changed_modules.txt)):"
          cat changed_modules.txt

      - name: tofu fmt + init + validate (changed modules)
        shell: bash
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          rc=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            [ -d "$d" ] || continue
            echo "::group::$d"
            (
              cd "$d"
              tofu fmt -check -recursive
              tofu init -backend=false -lockfile=readonly -input=false -no-color >/dev/null
              tofu validate -no-color
            ) || { echo "::error file=$d::tofu fmt/validate failed"; rc=1; }
            echo "::endgroup::"
          done < changed_modules.txt
          exit $rc

  # Drift net: validate every module. A new provider major that breaks an UNCHANGED
  # module (the ExternalDns case) only shows up here. Scheduled-only, so it never gates
  # a PR; a red run is the signal to fix.
  tf-validate-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    container: ghcr.io/plantonhq/planton/ci-toolchain:latest
    timeout-minutes: 60
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ runner.os }}

      - name: init + validate (all modules)
        # bash, explicitly: inside the toolchain container a step's default
        # shell is sh (dash), which has no arrays or process substitution,
        # and this script uses both. The push-triggered jobs above never hit
        # this because their steps declare bash.
        shell: bash
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          rc=0
          failed=()
          while IFS= read -r d; do
            echo "::group::$d"
            if ! ( cd "$d" && tofu init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && tofu validate -no-color ); then
              echo "::error file=$d::tofu validate failed"
              failed+=("$d")
              rc=1
            fi
            echo "::endgroup::"
          done < <(find catalog -type d -path '*/iac/tf' | grep -E '^catalog/[^/]+/[^/]+/iac/tf$' | sort)
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::${#failed[@]} module(s) failed validate:"
            printf '  - %s\n' "${failed[@]}"
            printf '%s\n' "${failed[@]}" > "$RUNNER_TEMP/failed_modules.txt"
          fi
          exit $rc

      # A red nightly run is otherwise silent: nobody watches scheduled runs.
      # One open issue carries the signal; later red runs comment on it.
      - name: Report failures on the tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/failed_modules.txt`;
            const failed = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim().split('\n') : [];
            const title = 'Nightly OpenTofu validation fails';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const list = failed.length ? failed.map(d => `- \`${d}\``).join('\n') : '- (the run failed before listing modules)';
            const body = `[Run ${context.runId}](${run}) found ${failed.length} module(s) that no longer pass \`tofu validate\` against their locked providers:\n\n${list}\n\nReproduce one with \`tofu init -backend=false -lockfile=readonly && tofu validate\` in the module directory.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
