# =============================================================================
# Release Packaging Guard
# =============================================================================
# Three invariants of the release content pipeline, enforced on every change
# that could break them:
#
#   1. Every content zip selector still matches the repository layout -- the
#      packager hard-fails on an empty selection, so a directory rename can
#      never ship a silently empty (or silently shrunken) zip.
#   2. The _test provider never reaches a user surface: it carries the full
#      per-kind file shape as permanent test infrastructure, and packaging
#      and module auto-tagging both exclude it explicitly.
#      See hack/guards/ensure_test_provider_stays_internal.sh for the
#      contract.
#   3. A module is its directory: every published form of a module (the
#      Terraform module.zip, the Pulumi source.zip, the Pulumi binary run
#      from a generated workspace) contains exactly the engine directory, so
#      a module that reads a sibling path works in the working tree and in
#      no release. See hack/guards/ensure_modules_are_self_contained.sh.
#   4. The module release tooling holds: tools/modulebuild (what a module
#      ships, how it is built and the module manifest), the deterministic zip
#      writer, the module manifest's grammar, publish_once.sh's recorded
#      checksums, and the release matrices covering every module's provider
#      and platform. Byte-for-byte reproducibility has its own, slower gate:
#      lint.reproducible-modules.yaml.
# =============================================================================

name: lint.release-packaging

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'tools/ci/release/**'
      - 'tools/modulebuild/**'
      - 'pkg/detzip/**'
      - 'pkg/downloads/**'
      - '.github/workflows/auto-tag.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release.pulumi-modules.yaml'
      - '.github/workflows/release.terraform-modules.yaml'
      - 'hack/guards/ensure_test_provider_stays_internal.sh'
      - 'hack/guards/ensure_modules_are_self_contained.sh'
      - '.github/workflows/lint.release-packaging.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'tools/ci/release/**'
      - 'tools/modulebuild/**'
      - 'pkg/detzip/**'
      - 'pkg/downloads/**'
      - '.github/workflows/auto-tag.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release.pulumi-modules.yaml'
      - '.github/workflows/release.terraform-modules.yaml'
      - 'hack/guards/ensure_test_provider_stays_internal.sh'
      - 'hack/guards/ensure_modules_are_self_contained.sh'
      - '.github/workflows/lint.release-packaging.yaml'

permissions:
  contents: read

jobs:
  release-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Content selectors match the tree and _test stays internal
        run: bash ./hack/guards/ensure_test_provider_stays_internal.sh

      - name: Modules read nothing outside their own directory
        run: bash ./hack/guards/ensure_modules_are_self_contained.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module release tooling
        run: |
          go test ./tools/modulebuild ./pkg/detzip ./pkg/downloads/...
          python3 -m unittest discover -s tools/ci/release -p 'publish_once_test.py'
