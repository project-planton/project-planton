# =============================================================================
# Pulumi Modules Release (Reusable Workflow)
# =============================================================================
# Builds every Pulumi module for every platform and uploads the binaries to
# Cloudflare R2 (downloads.planton.ai).
#
# tools/modulebuild builds them: it is the one place a release decides how a
# module is compiled and compressed, and it builds reproducibly (fixed
# toolchain, -trimpath, no VCS stamp, no build id, gzip with no name or time),
# so a module whose source did not change publishes the same bytes release
# after release. That is what lets a platform skip resources whose module did
# not change: it compares module digests (see pkg/downloads/modulemanifest).
#
#   - Matrix: provider x platform (linux_amd64, linux_arm64, darwin_arm64,
#     darwin_amd64, windows_amd64 -- the platforms the Pulumi module manifest
#     requires; linux_arm64 is every ARM runner the platform ships: Graviton,
#     and kind on an Apple Silicon Mac)
#   - Modules: `modulebuild list`, the tracked catalog/{provider}/{kind}/iac/pulumi
#     directories, built and published several at a time by
#     tools/ci/release/publish_pulumi_module.sh (one run per module, each with
#     its own scratch directory and part file)
#   - Each leg records what it published (module dir, artifact, the published
#     sha256 publish_once.sh reports) and uploads that list as a workflow
#     artifact; release.yaml's pulumi-module-manifest job merges every
#     leg's list into this engine's module manifest the moment the lane is done
#
# Upload path: s3://planton-foundation-downloads/releases/{tag}/modules/pulumi/{kind}/{platform}.gz
#              (windows artifacts carry the executable suffix: {platform}.exe.gz)
# Public URL:  https://downloads.planton.ai/releases/{tag}/modules/pulumi/{kind}/{platform}.gz
#
# Each kind also publishes its module SOURCE alongside the binaries:
#   releases/{tag}/modules/pulumi/{kind}/source.zip
# Source is platform-independent, so the zip uploads from exactly one matrix
# leg (linux_amd64) instead of five redundant writes. Consumers: the CLI's
# module-eject flow and source-rendering surfaces. Nothing executes it, so it
# is not part of the Pulumi module manifest.
#
# Called by: .github/workflows/release.yaml (after CLI release creates the release)
# =============================================================================

name: release.pulumi-modules

on:
  workflow_call:
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  R2_BUCKET: planton-foundation-downloads

jobs:
  # ============================================================================
  # Pre-flight: reject missing/misplaced Pulumi entrypoints before the long matrix
  # ============================================================================
  # The matrix build below runs `go build ./<...>/iac/pulumi` per kind, which
  # requires a `package main` at the entrypoint root. Catch a broken entrypoint ONCE here
  # (seconds) instead of failing dozens of expensive matrix legs after long compiles.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pulumi entrypoints
        run: bash ./hack/guards/ensure_pulumi_entrypoints.sh

  # ============================================================================
  # Build all kinds for each provider × platform combination
  # ============================================================================
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 72
      matrix:
        provider:
          - auth0
          - aws
          - azure
          - cloudflare
          - digitalocean
          - gcp
          - kubernetes
        platform:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain is the one go.mod names: modulebuild compiles modules
      # with exactly that toolchain and refuses to run on any other.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build modulebuild
        run: go build -o "${RUNNER_TEMP}/modulebuild" ./tools/modulebuild

      - name: Build and upload all kinds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          PROVIDER: ${{ matrix.provider }}
          PLATFORM: ${{ matrix.platform.goos }}_${{ matrix.platform.goarch }}
          # Modules built side by side. Linking a Pulumi binary is mostly
          # one core's work, so one module at a time left three of the
          # runner's four cores idle; three at a time keeps them busy within
          # its memory, and takes the largest providers' legs from about 50
          # minutes to about 20.
          PARALLEL_BUILDS: "3"
        run: |
          set -euo pipefail
          export TAG="${GITHUB_REF#refs/tags/}"
          export MODULEBUILD="${RUNNER_TEMP}/modulebuild"
          export PARTS_DIR="${RUNNER_TEMP}/parts"
          mkdir -p "${PARTS_DIR}"

          mapfile -t MODULES < <("${MODULEBUILD}" list -engine pulumi -provider "${PROVIDER}")
          TOTAL=${#MODULES[@]}

          echo "========================================"
          echo "PROVIDER: ${PROVIDER}"
          echo "PLATFORM: ${PLATFORM}"
          echo "MODULES: ${TOTAL} (${PARALLEL_BUILDS} at a time)"
          echo "========================================"

          if [ $TOTAL -eq 0 ]; then
            echo "WARNING: No Pulumi modules found for provider ${PROVIDER}"
            : > "${RUNNER_TEMP}/published.tsv"
            exit 0
          fi

          # Each module builds and publishes in its own run of the script
          # (tools/ci/release/publish_pulumi_module.sh), which writes its
          # own part file; xargs exits non-zero when any of them failed, and
          # every failure has already said which module it was.
          FAILED=0
          printf '%s\n' "${MODULES[@]}" \
            | xargs -P "${PARALLEL_BUILDS}" -I{} tools/ci/release/publish_pulumi_module.sh {} \
            || FAILED=1
          cat "${PARTS_DIR}"/*.tsv > "${RUNNER_TEMP}/published.tsv" 2>/dev/null || : > "${RUNNER_TEMP}/published.tsv"
          PUBLISHED=$(( $(wc -l < "${RUNNER_TEMP}/published.tsv") ))

          # Probe one uploaded artifact (and, on linux_amd64, its source)
          # through the public URL. The CLI and runners compose these URLs
          # from a shape pinned in pkg/downloads; this probe pins the OTHER
          # half of the contract -- that what CI just uploaded actually
          # serves at that shape.
          PROBE_KIND="$(head -n1 "${RUNNER_TEMP}/published.tsv" | cut -f1 | cut -d/ -f3)"
          PROBE_ARTIFACT="$(head -n1 "${RUNNER_TEMP}/published.tsv" | cut -f2)"
          PROBE_KEYS=()
          if [ -n "${PROBE_KIND}" ]; then
            PROBE_KEYS+=("releases/${TAG}/modules/pulumi/${PROBE_KIND}/${PROBE_ARTIFACT}")
            if [ "${PLATFORM}" = "linux_amd64" ]; then
              PROBE_KEYS+=("releases/${TAG}/modules/pulumi/${PROBE_KIND}/source.zip")
            fi
          fi
          for PROBE_KEY in "${PROBE_KEYS[@]}"; do
            PROBE_URL="https://downloads.planton.ai/${PROBE_KEY}"
            PROBE_CODE=$(curl -sf -I -o /dev/null -w "%{http_code}" \
              --retry 3 --retry-delay 5 --retry-all-errors "${PROBE_URL}" || true)
            if [ "${PROBE_CODE}" = "200" ]; then
              echo "✓ Public URL probe passed: ${PROBE_URL}"
            else
              echo "✗ ERROR: uploaded artifact does not serve at its public URL (HTTP ${PROBE_CODE}): ${PROBE_URL}"
              FAILED=1
            fi
          done

          echo ""
          echo "========================================"
          echo "JOB SUMMARY: ${PROVIDER} / ${PLATFORM}"
          echo "Modules: ${TOTAL}  Published: ${PUBLISHED}  Failed: $((TOTAL - PUBLISHED))"
          echo "========================================"

          if [ $FAILED -ne 0 ] || [ "${PUBLISHED}" -ne "${TOTAL}" ]; then
            echo "ERROR: not every module was built, published and served"
            exit 1
          fi

      # What this leg published, for the Pulumi module manifest release.yaml
      # publishes once every leg of this lane has finished. A rerun of the leg
      # replaces it. The name's module-part-pulumi- prefix is what that
      # manifest job collects, so it must stay.
      - name: Record what this leg published
        uses: actions/upload-artifact@v4
        with:
          name: module-part-pulumi-${{ matrix.provider }}-${{ matrix.platform.goos }}_${{ matrix.platform.goarch }}
          path: ${{ runner.temp }}/published.tsv
          if-no-files-found: error
          overwrite: true
          retention-days: 7
