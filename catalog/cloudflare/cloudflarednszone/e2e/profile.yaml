apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarednszone
spec:
  # The DNS zone under live E2E: the root Cloudflare kind, no prerequisites.
  # Each scenario creates its own run-scoped pending zone (a domain nobody
  # registers -- Cloudflare rejects duplicate zone names account-wide, so the
  # name carries the run id), runs deploy -> GET zones/{zone_id} verify ->
  # destroy -> verify-destroyed on both provisioners. The minimal scenario
  # proves the bare zone; the records-portfolio scenario proves inline
  # records through both value paths (simple content and typed structured
  # data) plus a record comment, and blind-imports the zone AND every record
  # (via the record_ids keyed output) in the round-trip.
  #
  # Scenario zoneName fields carry ${E2E_RUN_ID}, which the strict FQDN CEL
  # rejects RAW -- the fixture-integrity test (token substitution first) is
  # their validation gate, the same class as this kind's prerequisite file.
  #
  # Live-blocked (measured 2026-08-26; offline-plan-proven by e2e/manifest.yaml
  # -- details in the records-portfolio scenario header): DNSSEC on a PENDING
  # zone (400/1017; works on ACTIVE zones, so live proof needs a
  # registrar-delegated zone created through this kind), record tags
  # (400/9300), record settings ipv4/ipv6_only (400/9227), and non-default
  # dns_settings values (400/1003 entitlements, including Advanced
  # Nameservers). Deliberately offline from authoring: hold, subscription
  # (Billing Write scope; real money), vanity_name_servers, multi_provider.
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal + records-portfolio
  # through the full lifecycle with the apply-idempotency gate green; the
  # terraform blind import round-trip re-imported the bare zone (minimal) and
  # zone + all five records (portfolio, ids from the record_ids output) with
  # zero drift. The destroy verification also taught the harness that a
  # deleted zone answers GET zones/{id} with 400 code 1001, not 404.
  # Proven live 2026-10-23 on cloudflare/cloudflare 5.28.0 (pulumi-cloudflare
  # v6.23.1): the dns-settings scenario (every Free-plan default declared,
  # ns_ttl stated, nameservers.type standard) ran the full lifecycle on both
  # engines with the apply-idempotency gate green, after the modules stopped
  # managing the retired foundation_dns the API still reports.
  # The portfolio's root-dot NS record (content `...googledomains.com.`, which
  # the terraform module now sends without the dot, as the record kind's does)
  # joined after that run; its live proof on both engines is still owed.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
