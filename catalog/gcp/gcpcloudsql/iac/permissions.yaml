# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpcloudsql
spec:
  gcp:
    groups:
      - purpose: EnableSqlAdminApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_project_service enabling sqladmin.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: ManageInstance
        permissions:
          - cloudsql.instances.create
          - cloudsql.instances.get
          - cloudsql.instances.update
          - cloudsql.instances.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_sql_database_instance for primaries, read replicas, and read pools alike -- create, read/refresh, in-place updates (tier, disk, backup, network), and destroy. The provider polls the operations each mutation returns under the same instance-scoped authorization. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: ReadDefaultUsers
        permissions:
          - cloudsql.users.list
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Right after creating a primary, the provider lists its users to find a default root user with a wildcard host; the create fails without this read (cloudsql.users.list was refused on a live create). Replicas inherit their primary's users and skip the read. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: RemoveWildcardRootUser
        permissions:
          - cloudsql.users.delete
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Used only when a new primary carries a root user with a wildcard host, which MySQL creates and PostgreSQL and SQL Server do not -- the provider deletes that user immediately after create.
      - purpose: PeerPrivateNetwork
        permissions:
          - servicenetworking.services.get
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: network.private_network
        notes: Required only when network.private_network attaches the instance to a VPC over private service access -- the provider verifies the service-networking connection exists. Creating that connection itself (the PSA range and peering) is a separate prerequisite resource, not this module.
