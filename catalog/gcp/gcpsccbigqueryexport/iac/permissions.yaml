# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpsccbigqueryexport
spec:
  gcp:
    groups:
      - purpose: EnableSecurityCenterApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling securitycenter.googleapis.com on a project config's project (scope.project_id, or no scope at all); a folder or organization config enables nothing. disable_on_destroy is false, so the disable permission is never needed.
      - purpose: ManageBigQueryExport
        permissions:
          - securitycenter.bigQueryExports.create
          - securitycenter.bigQueryExports.get
          - securitycenter.bigQueryExports.update
          - securitycenter.bigQueryExports.delete
          - bigquery.datasets.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers the project, folder, and organization BigQuery-export resources (Pulumi securitycenter.V2*SccBigQueryExport) -- create, read on every refresh, PATCH updates of description, dataset, and filter, delete on destroy; Google checks the caller can see the dataset it names. Held at the scope (roles/securitycenter.bigQueryExportsEditor there) and on the dataset. The provider-default project lookup reads provider configuration only and needs no permission.
