# The Agent Substrate keyless snapshot set: the node agent moves every actor
# snapshot to and from Google Cloud Storage, and the API server reads the
# bucket, both as Google service accounts their Kubernetes ServiceAccounts
# are bound to through GKE Workload Identity. No key exists anywhere.
#
# - One identity per workload (one blast radius each), named for it.
# - The bindings' KSA coordinates are upstream's own ServiceAccounts in
#   upstream's fixed namespace: `ate-system/atelet` and
#   `ate-system/ate-api-server`.
# - The bucket is the control plane's own. objectAdmin covers what both
#   workloads do with objects; bucketViewer lets them read the bucket's
#   metadata. force_destroy lets the teardown delete it with snapshots still
#   inside.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-e2e-gke-atelet
spec:
  serviceAccountId: planton-e2e-gke-atelet
  projectId:
    value: ${GCP_PROJECT_ID}
  displayName: Planton E2E (gcp-gke) - Agent Substrate node agent snapshots via Workload Identity
  description: Keyless identity the Agent Substrate node agent assumes through GKE Workload Identity to write and read actor snapshots in the snapshot bucket
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-e2e-gke-ate-api
spec:
  serviceAccountId: planton-e2e-gke-ate-api
  projectId:
    value: ${GCP_PROJECT_ID}
  displayName: Planton E2E (gcp-gke) - Agent Substrate API server via Workload Identity
  description: Keyless identity the Agent Substrate API server assumes through GKE Workload Identity to read the snapshot bucket
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: planton-e2e-gke-atelet-wi
spec:
  projectId:
    value: ${GCP_PROJECT_ID}
  serviceAccountEmail:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-e2e-gke-atelet
      fieldPath: status.outputs.email
  ksaNamespace: ate-system
  ksaName: atelet
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: planton-e2e-gke-ate-api-wi
spec:
  projectId:
    value: ${GCP_PROJECT_ID}
  serviceAccountEmail:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-e2e-gke-ate-api
      fieldPath: status.outputs.email
  ksaNamespace: ate-system
  ksaName: ate-api-server
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: planton-e2e-gke-substrate
spec:
  projectId:
    value: ${GCP_PROJECT_ID}
  bucketName: planton-e2e-gke-substrate-${GCP_PROJECT_ID}
  location: ${GCP_REGION}
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  forceDestroy: true
  iamMembers:
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-atelet
          fieldPath: status.outputs.member
    - role: roles/storage.bucketViewer
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-atelet
          fieldPath: status.outputs.member
    - role: roles/storage.objectAdmin
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-ate-api
          fieldPath: status.outputs.member
    - role: roles/storage.bucketViewer
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-e2e-gke-ate-api
          fieldPath: status.outputs.member
