syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstrateworkerpool.v1alpha1;

// KubernetesAgentSubstrateWorkerPoolOutputs captures observable outputs after
// the WorkerPool is created on the target cluster. A pool is found by its name
// and namespace (`kubectl -n <namespace> get workerpool <name>`, its scale
// subresource, its worker Deployment of the same name); actors reach it
// through an actor template's `worker_selector`, which matches the pool's own
// labels.
message KubernetesAgentSubstrateWorkerPoolOutputs {
  // Name of the created WorkerPool (equals metadata.name); the worker
  // Deployment the controller renders carries the same name.
  string worker_pool_name = 1;

  // Namespace the WorkerPool and its worker pods run in (the resolved
  // spec.namespace).
  string namespace = 2;
}
