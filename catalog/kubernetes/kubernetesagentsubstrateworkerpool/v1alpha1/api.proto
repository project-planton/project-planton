syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstrateworkerpool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsubstrateworkerpool/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsubstrateworkerpool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSubstrateWorkerPool is an Agent Substrate WorkerPool: the
// worker pods actors run in, many to a worker, sized, placed and isolated as
// one pool.
message KubernetesAgentSubstrateWorkerPool {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSubstrateWorkerPool'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSubstrateWorkerPoolSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSubstrateWorkerPoolStatus status = 5;
}

// KubernetesAgentSubstrateWorkerPoolStatus holds the deployment status and outputs.
message KubernetesAgentSubstrateWorkerPoolStatus {
  // outputs
  KubernetesAgentSubstrateWorkerPoolOutputs outputs = 1;
}
