# Consumer-scoped install manifest for the Agent Substrate control plane's
# snapshot-store key (its published prerequisite profile names
# KubernetesSecret and reads substrate-s3): a copy of the control plane's own
# fixture-s3-credentials.yaml, in ate-system, which the namespace install
# manifest creates first (the profile lists the namespace before the Secret).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: e2e-ate-s3-credentials
spec:
  name: substrate-s3
  namespace:
    value: ate-system
  opaque:
    data:
      access_key_id: e2e-ate-snapshots-admin
      secret_access_key: e2e-ate-snapshots-admin-secret-not-a-real-secret
