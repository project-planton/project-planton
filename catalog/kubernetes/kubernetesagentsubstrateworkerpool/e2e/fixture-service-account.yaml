# The ServiceAccount the full-surface pool's workers run as, in the pool's
# namespace (deployed after fixture-namespace.yaml).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesServiceAccount
metadata:
  name: e2e-ate-workers-sa
spec:
  name: e2e-ate-workers
  namespace:
    value: e2e-ate-workers
