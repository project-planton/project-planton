syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstrate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsubstrate/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsubstrate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSubstrate installs the Agent Substrate control plane, which
// runs a large set of mostly idle AI agents on a small set of ready workers,
// suspending idle ones into object storage and resuming them on demand. One
// install per cluster.
message KubernetesAgentSubstrate {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSubstrate'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSubstrateSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSubstrateStatus status = 5;
}

// KubernetesAgentSubstrateStatus describes the observed state of KubernetesAgentSubstrate.
message KubernetesAgentSubstrateStatus {
  // outputs
  KubernetesAgentSubstrateOutputs outputs = 1;
}
