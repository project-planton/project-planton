# THE MINOR-RELEASE REFUSAL, from the API server: an earlier installation of
# this kind recorded v0.4.0 on the API server (the fixture). Before 1.0
# every Substrate minor is a reinstall, because the API server migrates the
# database irreversibly on its first start, so the deploy must be refused
# at plan with the back-up, destroy and clear steps; the verifier asserts
# the three parts and that the stamp still reads v0.4.0.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrate
metadata:
  name: e2e-ate-upgrade-refused
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-earlier-release.yaml"
    planton.dev/e2e-expect-deploy-failure: upgrade-refused
    planton.dev/e2e-expect-installed-version: v0.4.0
spec:
  namespace:
    value: ate-system
  platform:
    generic:
      serviceAccountIssuer: https://kubernetes.default.svc.cluster.local
  database:
    bundled: {}
  storage:
    s3:
      endpoint:
        value: http://s3.example.invalid:8333
      bucket: substrate-snapshots
      credentials:
        secretName:
          value: substrate-s3
  egress:
    credentialProvider:
      disabled: {}
