# The snapshot store's key, in ate-system where the node agent and the API
# server read it (a Secret is readable only from its own namespace). The
# keys are the kind's defaults, and the values the store fixture's fixed
# admin pair. Deployed after the namespace fixture, which owns ate-system.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: e2e-ate-s3-credentials
spec:
  name: substrate-s3
  namespace:
    value: ate-system
  opaque:
    data:
      access_key_id: e2e-ate-snapshots-admin
      secret_access_key: e2e-ate-snapshots-admin-secret-not-a-real-secret
