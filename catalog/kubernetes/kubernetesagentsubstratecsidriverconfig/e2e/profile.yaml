apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesagentsubstratecsidriverconfig
spec:
  tier: 4
  # Every lane runs on the pod-certificates cluster profile, behind the
  # control plane the registry prerequisite installs from its published
  # profile (bundled database, S3 on the catalog's SeaweedFS, definitions not
  # kept), whose namespace, store and store key come from this kind's
  # consumer-scoped prerequisites/. Each lane reads every field back from
  # the live object. A CSIDriverConfig has no status and Substrate's API
  # reports no driver health, so a lane with no CSI driver on the cluster
  # proves the object, not a volume.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 40
