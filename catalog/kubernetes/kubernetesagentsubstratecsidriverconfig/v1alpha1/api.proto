syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstratecsidriverconfig.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsubstratecsidriverconfig/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsubstratecsidriverconfig/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSubstrateCsiDriverConfig is an Agent Substrate
// CSIDriverConfig: how Substrate reaches a CSI driver, so actors' external
// volumes are provisioned and mounted by your storage.
message KubernetesAgentSubstrateCsiDriverConfig {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSubstrateCsiDriverConfig'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSubstrateCsiDriverConfigSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSubstrateCsiDriverConfigStatus status = 5;
}

// KubernetesAgentSubstrateCsiDriverConfigStatus holds the deployment status and outputs.
message KubernetesAgentSubstrateCsiDriverConfigStatus {
  // outputs
  KubernetesAgentSubstrateCsiDriverConfigOutputs outputs = 1;
}
